name: Scorecard supply-chain security

# OpenSSF Scorecard (https://github.com/ossf/scorecard-action), following the official
# template for public repos. Results are published to the OpenSSF API (publish_results)
# and uploaded to the Security tab (code scanning). A low score does not fail the job:
# the action has no score threshold, it only fails if the analysis or upload fails.
# Some checks (Branch-Protection, Code-Review, ...) depend on repository settings.
# See docs/qa/README.md.
#
# publish_results only accepts runs on the default branch, so there is no pull_request
# trigger. With publish_results the OpenSSF API also requires: no top-level env or
# defaults, no workflow-level write permissions, and only approved actions in the job.
# Actions are pinned by commit SHA (the Pinned-Dependencies check); Dependabot updates them.
on:
  # Re-runs when branch protection changes, so the Branch-Protection check stays current.
  branch_protection_rule:
  # Weekly, Mondays 07:30 UTC.
  schedule:
    - cron: '30 7 * * 1'
  push:
    branches: [ master ]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Upload the SARIF results to code scanning (Security tab).
      security-events: write
      # OIDC token required by publish_results.
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e  # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 7

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          sarif_file: results.sarif
