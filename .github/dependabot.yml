# Dependabot version updates (https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference).
# Weekly PRs for every dependency manifest in the repo. Security updates for known
# advisories (for example GHSA-2m69-gcr7-jv3q in SQLitePCLRaw.lib.e_sqlite3) are
# separate: they depend on Dependabot alerts / security updates in the repo settings.
version: 2
updates:
  # .NET packages of the five APIs and their test projects (ECommerce13.sln).
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Actions used by the workflows in .github/workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Newman, pinned in scripts/qa/package.json and package-lock.json.
  - package-ecosystem: "npm"
    directory: "/scripts/qa"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Schemathesis and lizard, pinned in scripts/qa/requirements*.txt.
  - package-ecosystem: "pip"
    directory: "/scripts/qa"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
