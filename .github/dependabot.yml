version: 2
updates:
  # .NET packages of the five APIs and their test projects (ECommerce13.sln).
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0

  # Actions used by the workflows in .github/workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0

  # Newman, pinned in scripts/qa/package.json and package-lock.json.
  - package-ecosystem: "npm"
    directory: "/scripts/qa"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0

  # Schemathesis, lizard and yamllint, pinned in scripts/qa/requirements*.txt.
  - package-ecosystem: "pip"
    directory: "/scripts/qa"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
